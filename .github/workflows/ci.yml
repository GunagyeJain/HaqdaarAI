name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://haqdaar:haqdaar@localhost:5433/haqdaar

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haqdaar
          POSTGRES_PASSWORD: haqdaar
          POSTGRES_DB: haqdaar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U haqdaar -d haqdaar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      # Proposal §6.2, the 0% hallucination gate. The adversarial half runs
      # here on every push: a provider that fabricates every field must not get
      # a single value past the grounding check. The live-model half is skipped
      # without GROQ_API_KEY, so CI tests our defence rather than a vendor's
      # goodwill or a rate limit.
      - name: Extraction hallucination gate
        run: pnpm test:eval

      # MUST run after the integration suite, not before it.
      #
      # match-performance seeds its 300 synthetic rows only on an empty database
      # and corpus-coverage skips on one, so loading the fixture earlier would
      # quietly change what both of those measure. The e2e suite is the only
      # consumer that needs real rows.
      #
      # Without this, four e2e tests cannot pass in CI at all: verdict cards,
      # source prose, the expanded ineligible list and the next-question prompt
      # all need schemes to exist. They failed on this repository’s first push.
      - name: Load the CI corpus fixture
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/corpus.sql

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # BOTH projects, deliberately. This ran --project=chromium only, so the
      # mobile project had never executed in CI at all -- and the target user is
      # far likelier to be on a mid-range Android than on a desktop.
      #
      # Two real defects hid behind that. A typed-journey test asserted an
      # element rendered `hidden lg:block`, so it could never pass on a phone
      # and had been failing unnoticed. And the results page scrolled sideways
      # on a 412px viewport, which no desktop run could see.
      #
      # The mobile project is Chromium with device emulation, so the browser
      # install above already covers it. The cost is wall-clock, and a gate that
      # never runs on the assumed device is not a gate.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Metric gates and where they live (docs/EVALUATION.md):
  #
  #   hallucination (§6.2)  `pnpm test:eval`   — every push, above
  #   matching speed (§6.2)  integration suite — seeds a synthetic corpus on an
  #                                              empty CI database
  #   latency (§6.1)         e2e suite         — typed path over real HTTP, but
  #                                              against the 25-scheme fixture, so
  #                                              the CI number is a smoke check and
  #                                              NOT the reported figure. The real
  #                                              one is measured over the full
  #                                              corpus and re-measured in prod.
  #   corpus coverage (§6.2) integration suite — skipped without a scraped
  #                                              corpus; enforced by the scrape
  #                                              workflow, which has one
  #
  # The voice path's latency needs provider credentials and is measured before
  # the pilot, not here.
