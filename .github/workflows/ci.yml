name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://haqdaar:haqdaar@localhost:5433/haqdaar

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haqdaar
          POSTGRES_PASSWORD: haqdaar
          POSTGRES_DB: haqdaar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U haqdaar -d haqdaar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      # Proposal §6.2, the 0% hallucination gate. The adversarial half runs
      # here on every push: a provider that fabricates every field must not get
      # a single value past the grounding check. The live-model half is skipped
      # without GROQ_API_KEY, so CI tests our defence rather than a vendor's
      # goodwill or a rate limit.
      - name: Extraction hallucination gate
        run: pnpm test:eval

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Metric gates and where they live (docs/EVALUATION.md):
  #
  #   hallucination (§6.2)  `pnpm test:eval`   — every push, above
  #   matching speed (§6.2)  integration suite — seeds a synthetic corpus on an
  #                                              empty CI database
  #   latency (§6.1)         e2e suite         — typed path over real HTTP
  #   corpus coverage (§6.2) integration suite — skipped without a scraped
  #                                              corpus; enforced by the scrape
  #                                              workflow, which has one
  #
  # The voice path's latency needs provider credentials and is measured before
  # the pilot, not here.
